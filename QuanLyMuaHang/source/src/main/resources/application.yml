spring:
  application:
    name: quan-ly-mua-hang
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quanlymuahang?useUnicode=true&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:7d}
    redis:
      repository-type: indexed
      namespace: qmh:session:indexed
      flush-mode: on_save
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: QMHSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        max-age: ${SESSION_COOKIE_MAX_AGE:604800s}

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@khvt.local}
    from-name: ${MAIL_FROM_NAME:Quản lý mua hàng KHVT}
    reset-password-base-url: ${APP_RESET_PASSWORD_URL:${app.frontend-url}/reset-password}
    token-validity-minutes: ${RESET_TOKEN_VALIDITY_MINUTES:15}
  files:
    root: ${FILE_STORAGE_ROOT:./data/files}
  pdf:
    font-path: ${APP_PDF_FONT_PATH:/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
  bootstrap-admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${ADMIN_BOOTSTRAP_NAME:Quản trị viên}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

