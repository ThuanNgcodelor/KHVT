spring:
  application:
    name: quan-ly-mua-hang
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/quanlymuahang}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: qmh:session
      flush-mode: on_save
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: QMHSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  files:
    root: ${FILE_STORAGE_ROOT:./data/files}
  bootstrap-admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${ADMIN_BOOTSTRAP_NAME:Quản trị viên}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

